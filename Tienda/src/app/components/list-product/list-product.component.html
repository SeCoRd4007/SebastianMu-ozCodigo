<app-toolbar></app-toolbar>
<app-search-products 
  [displayDialog]="displaySearchDialog"
  [listProducts]="listProducts"
  (close)="closeSearchDialog()">
</app-search-products>
<div class="p-fluid">
    <p-table [value]="listProducts" *ngIf="listProducts.length > 0" class="p-mt-4"  [paginator]="true" 
        [rows]="5"
        [rowsPerPageOptions]="[5, 10, 20]">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
  
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.name }}</td>
          <td>{{ item.description }}</td>
          <td>{{ item.price | currency }}</td>
          <td>{{ item.stock }}</td>
          <td>
            <button pButton type="button" icon="pi pi-pencil" class="p-button-info p-button-sm" (click)="openEditDialog(item)"></button>
            <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm p-ml-2" (click)="deleteProduct(item.id!, item.name)"></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  
    <h5 *ngIf="listProducts.length === 0" class="p-text-center">No hay productos en el inventario</h5>
  </div>
  <button pButton class="mt-5 ml-5" icon="pi pi-plus-circle" type="button" (click)="openAddDialog()" ></button>
  <button pButton class="mt-5 ml-5" icon="pi pi-search" type="button" (click)="openSearchDialog()" ></button>
<p-dialog [modal]="true" [(visible)]="displayAddDialog" [style]="{ width: '35rem' }">
    <app-add-product [(dialogVisible)]="displayAddDialog"></app-add-product>
</p-dialog>
<p-dialog [modal]="true" [(visible)]="displayEditDialog" [style]="{ width: '35rem' }">
    <app-edit-product [(dialogVisible)]="displayEditDialog" [selectedProduct]="selectedProduct"></app-edit-product>
  </p-dialog>
