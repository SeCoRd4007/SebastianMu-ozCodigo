<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{ width: '30rem' }">
    <h3>Buscar Productos</h3>
    
    <!-- Campo de búsqueda -->
    <input type="text" pInputText [(ngModel)]="searchTerm" placeholder="Buscar productos..."/>
  
    <!-- Botón de búsqueda -->
    <button pButton label="Buscar" icon="pi pi-search" (click)="onSearch()"></button>
  
    <!-- Tabla de productos filtrados -->
    <p-table [value]="filteredProducts" *ngIf="filteredProducts.length > 0">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th>Stock</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.name }}</td>
          <td>{{ item.description }}</td>
          <td>{{ item.price | currency }}</td>
          <td>{{ item.stock }}</td>
        </tr>
      </ng-template>
    </p-table>
  
    <!-- Mensaje cuando no hay productos -->
    <h5 *ngIf="filteredProducts.length === 0">No se encontraron productos.</h5>
  
    <p-footer>
      <button pButton label="Cerrar" icon="pi pi-times" (click)="closeDialog()"></button>
    </p-footer>
  </p-dialog>
